[pytest]
# 异步测试模式
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Python 路径
pythonpath = .

# 测试发现模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记
markers =
    spot: 现货市场测试
    futures: 期货市场测试
    rest: REST API测试
    ws: WebSocket订阅测试
    slow: 耗时较长的测试 (>10s)
    realtime: 实时数据推送测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
